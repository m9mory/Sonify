# Sonify — локальный стек: api + postgres + redis + minio
# Запуск:  docker compose -f infra/docker-compose.yml up --build
# API:     http://127.0.0.1:8080/health
# MinIO:   http://127.0.0.1:9001 (minioadmin / minioadmin)

name: sonify

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: sonify-api
    ports:
      - "8080:8080"
    environment:
      SONIFY_ENV: dev
      SONIFY_HOST: 0.0.0.0
      SONIFY_PORT: "8080"
      # В MVP API использует SQLite; DATABASE_URL зарезервирован под PG-бэкенд (этап 2).
      DATABASE_URL: postgresql://sonify:sonify@postgres:5432/sonify
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: sonify-audio
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      STORAGE: local
      ADMIN_TOKEN: dev-admin-token
      ENABLE_SOUNDCLOUD_EMBEDS: "1"
    volumes:
      - api-var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sonify-postgres
    environment:
      POSTGRES_USER: sonify
      POSTGRES_PASSWORD: sonify
      POSTGRES_DB: sonify
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonify -d sonify"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sonify-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: sonify-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  api-var:
  pg-data:
  minio-data:
