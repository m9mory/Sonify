name: Backend

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Black-box smoke test (spawns real uvicorn)
        working-directory: backend
        run: python -u smoke_test.py

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: false
          load: true
          tags: sonify-api:ci
      - name: Run container and check /health
        run: |
          docker run -d --name sonify-ci -p 8080:8080 sonify-api:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health; then echo; exit 0; fi
            sleep 1
          done
          echo "container did not become healthy"
          docker logs sonify-ci
          exit 1
      - name: Container logs
        if: always()
        run: docker logs sonify-ci || true
